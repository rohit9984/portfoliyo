    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rohit-portfolio-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* localStorage may be blocked */
        }
      })();
    </script>
